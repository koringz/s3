<html>
<head>
  <title>🧩 Rect 测试</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; overflow: hidden; }
    h1 { position: absolute; left: 20px; top: 12px; color: #fff; font-size: 16px; font-family: system-ui; }
    canvas { display: block; }
  </style>
  <script src="./../lib/S3.js"></script>
</head>
<body>
  <h1>🧩 Rect 组件</h1>
  <canvas></canvas>

<script>
var W = document.body.offsetWidth;
var H = document.body.offsetHeight;

var Body = s3.body(s3.dom("canvas"));
Body.set({ width: W, height: H });

// 用 rect 组件画柱状图
var bars = [];
var bw = (W - 100) / 12;
for (var i = 0; i < 12; i++) {
  var h = Math.random() * (H * 0.5) + 30;
  bars.push({
    x: 50 + i * bw + 2,
    y: H - 50 - h,
    width: bw - 4,
    height: h,
    color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22',
            '#1abc9c','#e84393','#00cec9','#fd79a8','#6c5ce7','#fdcb6e'][i]
  });
}

function particles () {
  return bars;
}
Body.component('rect', { type:'Array', property: bars });
</script>
</body>
</html>
