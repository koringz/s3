<html>
<head>
  <title>🧩 Rect 测试</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; overflow: hidden; }
    h1 { position: absolute; left: 20px; top: 12px; color: #fff; font-size: 16px; font-family: system-ui; }
    canvas { display: block; }
  </style>
  <script src="./../lib/S3.js"></script>
</head>
<body>
  <h1>🧩 Rect 组件</h1>
  <canvas></canvas>

<script>
var W = document.body.offsetWidth;
var H = document.body.offsetHeight;

var Body = s3.body(s3.dom("canvas"));
Body.set({ width: W, height: H });
const algos = s3.algo();

var bars = algos                  // 创建 algo 实例（支持链式调用）
    .bars(12)                         // 12 根柱子
    .width(62)
    .gap(10)
    .baseY(H - 50)                    // 柱状图基线
    .heightRange(30, H * 0.5 + 30)   // 高度范围
    .colors([
        '#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22',
        '#1abc9c','#e84393','#00cec9','#fd79a8','#6c5ce7','#fdcb6e'
    ])
    .generateBars();

    console.log(bars)

Body.component('rect', { type:'Array', property: bars });
</script>
</body>
</html>
